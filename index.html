<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FR24 Airport Cams</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0c0a;
    --surface: #161410;
    --border:  #2b271e;
    --border2: #453e2c;
    --accent:  #ffc72c;
    --accent2: #e0a810;
    --red:     #ff4a3a;
    --amber:   #ff8a3d;
    --green:   #5ee38a;
    --text:    #e6dfcf;
    --text2:   #fff7e6;
    --muted:   #8f8670;
    --dim:     #4d4636;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  button { font: inherit; color: inherit; }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(180deg, #14120e 0%, #1a1712 100%);
    border-bottom: 1px solid var(--border2);
    padding: 10px 16px; flex-shrink: 0; position: relative; z-index: 10;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    box-shadow: 0 2px 30px rgba(255,199,44,0.06);
  }
  header::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--amber), var(--accent), transparent);
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
  /* Logo styled as a runway (mandatory instruction) sign: white legend outlined in black on red, black frame */
  .brand-sign {
    height: 40px; padding: 0 10px; flex-shrink: 0;
    display: flex; align-items: center;
    background: #c8102e; border: 2px solid #000; border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 2px 12px rgba(200,16,46,0.35);
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1;
    letter-spacing: 1px; color: #fff;
    -webkit-text-stroke: 1px #000; paint-order: stroke fill;
  }
  .brand-sign span { margin: 0 3px; }
  .brand-text {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 24px; letter-spacing: 5px; color: var(--text2);
    text-shadow: 0 0 20px rgba(255,199,44,0.25); white-space: nowrap;
  }
  .brand-sub {
    font-weight: 300; font-size: 10px; letter-spacing: 3px; color: var(--muted);
    margin-top: 2px; white-space: nowrap; text-transform: uppercase;
  }

  #list-status {
    font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase;
  }
  #list-status.warn { color: var(--amber); }

  #clock {
    font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 600;
    color: var(--accent); letter-spacing: 3px; text-shadow: 0 0 12px rgba(255,199,44,0.5);
  }

  .hbtn {
    background: rgba(255,199,44,0.05); border: 1px solid var(--border2);
    color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    padding: 7px 12px; cursor: pointer; transition: all 0.2s; line-height: 1;
    text-decoration: none; white-space: nowrap;
  }
  .hbtn:hover, .hbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  /* ===== BODY ===== */
  .main { flex: 1; display: flex; min-height: 0; position: relative; }

  #stage { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  #stage.scroll { overflow-y: auto; overscroll-behavior: contain; }

  .tile {
    position: absolute; background: #000; border: 1px solid var(--border);
    transition: left .25s, top .25s, width .25s, height .25s;
    overflow: hidden;
  }
  .tile.audio { border-color: var(--green); box-shadow: 0 0 14px rgba(94,227,138,0.25); }
  .tile.focus { border-color: var(--accent); }
  .tile iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Label and controls sit together in the bottom-right corner, clear of Flightradar24's own overlay */
  .tile-corner {
    position: absolute; right: 6px; bottom: 6px; z-index: 2;
    display: flex; align-items: flex-end; gap: 4px; pointer-events: none; max-width: calc(100% - 12px);
  }
  /* On small tiles the buttons wrap upward instead of running off the left edge */
  .tile-bar {
    display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 4px; min-width: 0;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .tile:hover .tile-bar, .tile:focus-within .tile-bar, .tile.touch-bar .tile-bar { opacity: 1; pointer-events: auto; }
  .tbtn {
    background: rgba(13,12,10,0.85); border: 1px solid var(--border2); color: var(--text);
    width: 28px; height: 26px; cursor: pointer; font-size: 13px; line-height: 1; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .tbtn:hover { border-color: var(--accent); color: var(--accent); }
  .tbtn[aria-pressed="true"] { border-color: var(--green); color: var(--green); }

  /* Always-visible code label so a wall display can tell feeds apart */
  .tile-tag {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px;
    color: var(--text2); background: rgba(10,9,7,0.7); padding: 1px 6px; border: 1px solid var(--border);
    line-height: 22px; flex-shrink: 0; pointer-events: auto; cursor: pointer;
  }
  .tile:hover .tile-tag, .tile.touch-bar .tile-tag { color: var(--accent); border-color: var(--border2); }

  /* Shown over a tile when YouTube won't play that camera in the page */
  .tile-err {
    position: absolute; inset: 0; z-index: 1; background: rgba(13,12,10,0.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 12px 12px 40px; text-align: center;
  }
  .tile-err[hidden] { display: none; }
  .tile-err-msg { font-size: 13px; color: var(--text2); line-height: 1.4; max-width: 34em; }
  .tile-err-note { font-size: 11px; color: var(--muted); line-height: 1.4; max-width: 34em; }
  .tile-err .hbtn { color: var(--accent); border-color: var(--accent); }

  #empty {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 20px;
    color: var(--muted); font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
  }

  /* ===== CAMERA PANEL ===== */
  #panel {
    width: 300px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border2);
    display: flex; flex-direction: column; min-height: 0;
  }
  #panel[hidden] { display: none; }
  .panel-head {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .panel-title {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px;
    letter-spacing: 3px; color: var(--text2); margin-right: auto; text-transform: uppercase;
  }
  .sbtn {
    background: transparent; border: 1px solid var(--border2); color: var(--muted);
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 5px 8px; cursor: pointer;
  }
  .sbtn:hover { border-color: var(--accent); color: var(--accent); }

  #cam-list { list-style: none; overflow-y: auto; flex: 1; }
  .cam {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px;
    border-bottom: 1px solid var(--border);
  }
  .cam.offline { opacity: 0.5; }
  .cam label { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
  .cam input { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  .cam-code {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2px;
    color: var(--accent); width: 38px; flex-shrink: 0;
  }
  .cam-name { font-size: 12px; color: var(--text); line-height: 1.35; min-width: 0; overflow-wrap: anywhere; }
  .cam-note { display: block; font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
  .cam-move { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .cam-move button, .cam-del {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    width: 24px; height: 18px; font-size: 10px; line-height: 1; cursor: pointer;
  }
  .cam-del { height: 24px; }
  .cam-move button:hover, .cam-del:hover { border-color: var(--accent); color: var(--accent); }
  .cam-move button:disabled { opacity: 0.3; cursor: default; border-color: var(--border); color: var(--muted); }

  .panel-foot { border-top: 1px solid var(--border); padding: 12px 14px; }
  .panel-foot label { display: block; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .add-row { display: flex; gap: 6px; }
  #add-url {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border2); color: var(--text);
    padding: 7px 8px; font-size: 12px; font-family: 'Inter', sans-serif;
  }
  #add-url:focus { outline: none; border-color: var(--accent); }
  #add-msg { font-size: 11px; color: var(--amber); margin-top: 6px; min-height: 14px; }
  .bw-note { font-size: 10px; color: var(--dim); letter-spacing: 1px; margin-top: 8px; line-height: 1.5; }
  .bw-note.warn { color: var(--amber); }

  .copyright-note {
    flex-shrink: 0; text-align: center; font-family: 'Share Tech Mono', monospace;
    font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
    padding: 6px 14px calc(6px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
  }
  .copyright-note a { color: var(--text); text-decoration: none; }
  .copyright-note a:hover { color: var(--accent); }

  /* Phones: the camera panel slides over the grid instead of sitting beside it */
  @media (max-width: 768px) {
    header { padding: 8px 12px; }
    header { gap: 8px; }
    .brand { gap: 8px; }
    .brand-text { font-size: 18px; letter-spacing: 2px; }
    .brand-sign { height: 32px; padding: 0 6px; font-size: 20px; }
    .brand-sign span { margin: 0 2px; }
    .hbtn { padding: 7px 9px; letter-spacing: 1px; }
    .brand-sub, #clock { display: none; }
    #panel {
      position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; width: min(340px, 100%);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }
  }

  /* Touch screens: tap the airport code to show that tile's controls (taps on the video go to YouTube) */
  @media (hover: none) {
    .tile:hover .tile-bar, .tile:focus-within .tile-bar { opacity: 0; pointer-events: none; }
    .tile:hover .tile-tag { color: var(--text2); border-color: var(--border); }
    .tile.touch-bar .tile-bar { opacity: 1; pointer-events: auto; }
    .tile.touch-bar .tile-tag { color: var(--accent); border-color: var(--border2); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-sign" aria-hidden="true">FR<span>-</span>24</div>
    <div>
      <div class="brand-text">AIRPORT CAMS</div>
      <div class="brand-sub">Flightradar24 // Live on YouTube</div>
    </div>
  </div>
  <div id="list-status" role="status">Loading</div>
  <div id="clock">--:--:--</div>
  <button class="hbtn" id="panel-btn" aria-pressed="true" aria-controls="panel">Cameras</button>
</header>

<div class="main">
  <div id="stage">
    <div id="empty">
      <div id="empty-text">No cameras selected</div>
      <button class="hbtn" id="empty-btn">Choose cameras</button>
    </div>
  </div>

  <aside id="panel" aria-label="Cameras">
    <div class="panel-head">
      <div class="panel-title">Cameras</div>
      <button class="sbtn" id="all-btn">All</button>
      <button class="sbtn" id="none-btn">None</button>
    </div>
    <ul id="cam-list"></ul>
    <div class="panel-foot">
      <label for="add-url">Add a YouTube stream</label>
      <form class="add-row" id="add-form">
        <input id="add-url" type="text" placeholder="Paste a YouTube link" autocomplete="off" spellcheck="false">
        <button class="sbtn" type="submit">Add</button>
      </form>
      <div id="add-msg" role="status"></div>
      <div class="bw-note" id="bw-note"></div>
    </div>
  </aside>
</div>

<div class="copyright-note"><span id="version-note"></span> · © 2026 RJLcode. All Rights Reserved. <a href="https://github.com/RJLcode/Flightradar24viewer/blob/main/LICENSE" target="_blank" rel="noopener">License</a> · Streams © Flightradar24</div>

<script>
(function () {
  "use strict";

  var APP_VERSION  = "1.2.2";
  var APP_RELEASED = "2026-10-12";
  var WORKER_URL   = "https://fr24-cams.yanks126.workers.dev";
  var LIST_REFRESH = 5 * 60 * 1000;
  var EMBED_ORIGIN = "https://www.youtube-nocookie.com"; // privacy-mode player; plays on iPhone Safari where youtube.com embeds hit the sign-in check
  var RETRY_MS     = 5 * 60 * 1000; // how often to retry a camera YouTube refused
  var STORE_KEY    = "fr24cams.v1";
  var HEAVY_COUNT  = 9; // more tiles than this gets heavy on bandwidth/CPU

  // Used only until the worker answers for the first time on this browser (or if it never does).
  // Stream IDs change when Flightradar24 restarts a camera, so the live list from the worker wins.
  var SEED = [
    { id: "SgvpyjQX_HM", title: "LHR Airport LIVE 24/7 • Heathrow, London" },
    { id: "OUBslrCqREs", title: "LGA Airport LIVE 24/7 • LaGuardia, New York" },
    { id: "iZRbml7fnXI", title: "FR24 - MSY New Orleans LIVE 24/7" },
    { id: "sJl7PsdHxWM", title: "MKE Airport LIVE 24/7 • Milwaukee, Wisconsin" },
    { id: "V7_orOtu-oo", title: "LAS Vegas Airport LIVE 24/7 with views of 26R & 26L" },
    { id: "fFl0qD108sk", title: "RNO Reno Airport LIVE 24/7" },
    { id: "2IQmpCXbOmM", title: "Iconic SXM Airport LIVE 24/7 – Sint Maarten Maho Beach" },
    { id: "4nC8r5neaow", title: "ACE Lanzarote Airport LIVE 24/7 - Canary Islands SPAIN" }
  ];

  // ---- Saved settings (per browser) ----
  // Cameras are keyed by airport code from the title (e.g. "LAS"), so a hidden or reordered camera
  // stays that way when its stream restarts under a new video ID.
  var state = { hidden: [], order: [], custom: [], lastLive: null, panel: true };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved) Object.keys(state).forEach(function (k) { if (k in saved) state[k] = saved[k]; });
  } catch (e) {}
  if (window.matchMedia("(max-width: 768px)").matches) state.panel = false;

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var live = state.lastLive ? state.lastLive.streams : SEED;
  var liveOk = false;      // has the worker answered this session?
  var focusKey = null;     // tile shown large
  var audioKey = null;     // the one tile not muted
  var tiles = {};          // key -> { el, iframe, id }

  function codeOf(title) {
    var m = /\b([A-Z]{3})\b/.exec(title || "");
    return m ? m[1] : null;
  }

  function cleanTitle(t) {
    return String(t || "").replace(/\s*(LIVE\s*24\/7|LIVE)\s*/g, " ").replace(/[✈️]/g, "")
      .replace(/^FR24\s*-\s*/, "").replace(/\s+[•–-]\s*$/, "").replace(/\s{2,}/g, " ").trim();
  }

  // All cameras the page knows about, in the user's order. Each: { key, id, title, code, custom, offline }
  function cameras() {
    var byKey = {};
    live.forEach(function (s) {
      var code = codeOf(s.title), key = code || s.id;
      if (!byKey[key]) byKey[key] = { key: key, id: s.id, title: cleanTitle(s.title), code: code || "CAM", custom: false };
    });
    state.custom.forEach(function (c) {
      var key = "yt:" + c.id;
      if (!byKey[key]) byKey[key] = { key: key, id: c.id, title: c.title, code: "YT", custom: true };
    });
    var list = Object.keys(byKey).map(function (k) { return byKey[k]; });
    list.sort(function (a, b) {
      var ia = state.order.indexOf(a.key), ib = state.order.indexOf(b.key);
      if (ia < 0) ia = 1e6; if (ib < 0) ib = 1e6;
      return ia - ib;
    });
    return list;
  }

  function isShown(key) { return state.hidden.indexOf(key) < 0; }

  // ---- Fetch which cameras are live ----
  var statusEl = document.getElementById("list-status");

  function setStatus(text, warn) {
    statusEl.textContent = text;
    statusEl.classList.toggle("warn", !!warn);
  }

  function loadLive() {
    return fetch(WORKER_URL, { cache: "no-store" })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); })
      .then(function (j) {
        live = j.streams;
        liveOk = true;
        state.lastLive = { updated: j.updated, streams: j.streams };
        save();
        setStatus(live.length + " live");
        render();
      })
      .catch(function () {
        var when = state.lastLive ? new Date(state.lastLive.updated) : null;
        setStatus(when ? "Saved list · " + when.toLocaleDateString([], { month: "short", day: "numeric" }) : "Built-in list", true);
        statusEl.title = "Couldn't get the live camera list; streams that have restarted may not play.";
        render();
      });
  }

  // ---- Players ----
  var stage = document.getElementById("stage");

  function embedSrc(id) {
    return EMBED_ORIGIN + "/embed/" + id + "?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=" +
      encodeURIComponent(location.origin);
  }

  function command(t, func, args) {
    if (!t.iframe.contentWindow) return;
    t.iframe.contentWindow.postMessage(JSON.stringify({ event: "command", func: func, args: args || [] }), EMBED_ORIGIN);
  }

  function makeTile(cam) {
    var el = document.createElement("div");
    el.className = "tile";
    el.innerHTML =
      '<iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>' +
      '<div class="tile-err" hidden>' +
        '<div class="tile-err-msg"></div>' +
        '<a class="hbtn" data-act="yt" target="_blank" rel="noopener">Watch on YouTube &#x2197;</a>' +
        '<div class="tile-err-note"></div>' +
      '</div>' +
      '<div class="tile-corner">' +
        '<div class="tile-bar">' +
          '<button class="tbtn" data-act="audio" aria-pressed="false" title="Listen to this camera (mutes the others)">&#x1F507;</button>' +
          '<button class="tbtn" data-act="focus" title="Enlarge">&#x2922;</button>' +
          '<a class="tbtn" data-act="yt" target="_blank" rel="noopener" title="Open on YouTube">&#x2197;</a>' +
          '<button class="tbtn" data-act="hide" title="Hide this camera">&#x2715;</button>' +
        '</div>' +
        '<div class="tile-tag"></div>' +
      '</div>';
    var t = { el: el, iframe: el.querySelector("iframe"), id: null, retry: null };
    t.iframe.addEventListener("load", function () {
      // Ask the player to report errors and state changes back to this page (see the message listener)
      t.iframe.contentWindow.postMessage(JSON.stringify({ event: "listening", id: cam.key, channel: "widget" }), EMBED_ORIGIN);
      command(t, "addEventListener", ["onError"]);
      command(t, "addEventListener", ["onStateChange"]);
      // Re-apply audio after the player (re)loads, since it always starts muted
      if (audioKey === cam.key) { command(t, "unMute"); command(t, "setVolume", [100]); }
    });
    el.addEventListener("click", function (e) {
      var b = e.target.closest("[data-act]");
      if (!b) {
        var open = !el.classList.contains("touch-bar");
        Object.keys(tiles).forEach(function (k) { tiles[k].el.classList.remove("touch-bar"); });
        el.classList.toggle("touch-bar", open);
        return;
      }
      var act = b.getAttribute("data-act");
      if (act === "audio") setAudio(audioKey === cam.key ? null : cam.key);
      else if (act === "focus") { focusKey = focusKey === cam.key ? null : cam.key; layout(); }
      else if (act === "hide") setShown(cam.key, false);
    });
    stage.appendChild(el);
    return t;
  }

  // ---- Cameras YouTube refuses to play ----
  // 101/150/152: not playable in an embedded player here. YouTube also gives this when it suspects the
  // viewer's network of being a bot, which is why it can work on youtube.com but not in this page.
  function showError(t, code) {
    var msg, note;
    if (code === 100) {
      msg = "This stream has ended or moved.";
      note = "The camera list checks for its new link every 5 minutes.";
    } else if (code === 101 || code === 150 || code === 152) {
      msg = "YouTube isn't letting this camera play inside the page right now.";
      note = "Watch on YouTube still works. Trying again every 5 minutes.";
    } else {
      msg = "The YouTube player hit an error (code " + code + ").";
      note = "Trying again every 5 minutes.";
    }
    t.el.querySelector(".tile-err-msg").textContent = msg;
    t.el.querySelector(".tile-err-note").textContent = note;
    t.el.querySelector(".tile-err").hidden = false;
    clearTimeout(t.retry);
    t.retry = setTimeout(function retry() {
      if (!t.el.isConnected) return;
      if (document.hidden) { t.retry = setTimeout(retry, RETRY_MS); return; }
      t.iframe.src = embedSrc(t.id);
    }, RETRY_MS + Math.random() * 60000); // spread retries out so they don't all hit YouTube at once
  }

  function clearError(t) {
    clearTimeout(t.retry);
    t.retry = null;
    t.el.querySelector(".tile-err").hidden = true;
  }

  window.addEventListener("message", function (e) {
    if (e.origin !== EMBED_ORIGIN) return;
    var t = Object.keys(tiles).map(function (k) { return tiles[k]; })
      .filter(function (x) { return x.iframe.contentWindow === e.source; })[0];
    if (!t) return;
    var d;
    try { d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    if (!d) return;
    if (d.event === "onError") showError(t, Number(d.info));
    var state = d.event === "onStateChange" ? d.info : d.event === "infoDelivery" && d.info ? d.info.playerState : null;
    if (state === 1) clearError(t); // playing
  });

  function setAudio(key) {
    audioKey = key;
    Object.keys(tiles).forEach(function (k) {
      var t = tiles[k], on = k === key;
      command(t, on ? "unMute" : "mute");
      if (on) command(t, "setVolume", [100]);
      t.el.classList.toggle("audio", on);
      var b = t.el.querySelector('[data-act="audio"]');
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.innerHTML = on ? "&#x1F50A;" : "&#x1F507;";
    });
  }

  // Tiles are positioned absolutely and never moved in the DOM: moving an iframe reloads the stream.
  function render() {
    var cams = cameras(), shown = cams.filter(function (c) { return isShown(c.key); });
    var want = {};
    shown.forEach(function (c) {
      want[c.key] = true;
      var t = tiles[c.key] || (tiles[c.key] = makeTile(c));
      if (t.id !== c.id) { t.id = c.id; clearError(t); t.iframe.src = embedSrc(c.id); }
      t.iframe.title = c.title;
      t.el.querySelector(".tile-tag").textContent = c.code;
      t.el.querySelector(".tile-tag").title = c.title;
      t.el.querySelectorAll('[data-act="yt"]').forEach(function (a) { a.href = "https://www.youtube.com/watch?v=" + c.id; });
    });
    Object.keys(tiles).forEach(function (k) {
      if (!want[k]) { clearTimeout(tiles[k].retry); tiles[k].el.remove(); delete tiles[k]; }
    });
    if (focusKey && !want[focusKey]) focusKey = null;
    if (audioKey && !want[audioKey]) audioKey = null;

    var empty = document.getElementById("empty");
    empty.style.display = shown.length ? "none" : "flex";
    document.getElementById("empty-btn").style.display = state.panel ? "none" : "";

    renderList(cams);
    layout(shown);
  }

  // Best grid for n 16:9 tiles in w×h: try every column count, keep the one with the biggest tiles.
  function fit(n, w, h, gap) {
    var best = { cols: 1, rows: n, tw: 0, th: 0 };
    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols);
      var tw = (w - gap * (cols - 1)) / cols, th = (h - gap * (rows - 1)) / rows;
      if (tw / th > 16 / 9) tw = th * 16 / 9; else th = tw * 9 / 16;
      if (tw > best.tw) best = { cols: cols, rows: rows, tw: tw, th: th };
    }
    return best;
  }

  function place(list, x0, y0, w, h, gap) {
    if (!list.length) return;
    var g = fit(list.length, w, h, gap);
    var gridH = g.rows * g.th + (g.rows - 1) * gap;
    list.forEach(function (key, i) {
      var r = Math.floor(i / g.cols), c = i % g.cols;
      var inRow = Math.min(g.cols, list.length - r * g.cols);
      var rowW = inRow * g.tw + (inRow - 1) * gap;
      var s = tiles[key].el.style;
      s.left = (x0 + (w - rowW) / 2 + c * (g.tw + gap)) + "px";
      s.top = (y0 + (h - gridH) / 2 + r * (g.th + gap)) + "px";
      s.width = g.tw + "px";
      s.height = g.th + "px";
    });
  }

  // Keeps a gap below the last camera when the grid scrolls
  var scrollEnd = document.createElement("div");
  scrollEnd.style.cssText = "position:absolute;left:0;width:1px;height:6px;pointer-events:none";
  stage.appendChild(scrollEnd);

  function layout(shown) {
    var keys = (shown || cameras().filter(function (c) { return isShown(c.key); })).map(function (c) { return c.key; })
      .filter(function (k) { return tiles[k]; });
    var pad = 6, gap = 6, W = stage.clientWidth - pad * 2, H = stage.clientHeight - pad * 2;
    Object.keys(tiles).forEach(function (k) { tiles[k].el.classList.toggle("focus", k === focusKey); });

    var focused = focusKey && keys.indexOf(focusKey) >= 0 && keys.length > 1;

    // Phones in portrait: one camera per row at full width, scrolling, once they no longer fit on screen
    var rowH = W * 9 / 16;
    var scroll = !focused && W <= 760 && H > W && keys.length * (rowH + gap) - gap > H;
    stage.classList.toggle("scroll", scroll);
    if (scroll) {
      keys.forEach(function (key, i) {
        var st = tiles[key].el.style;
        st.left = pad + "px";
        st.top = (pad + i * (rowH + gap)) + "px";
        st.width = W + "px";
        st.height = rowH + "px";
      });
      scrollEnd.style.top = (pad + keys.length * (rowH + gap) - gap) + "px";
      return;
    }
    stage.scrollTop = 0;

    if (!focused) { place(keys, pad, pad, W, H, gap); return; }

    // Focus: one big tile, the rest as a strip beside it (landscape) or below it (portrait)
    var rest = keys.filter(function (k) { return k !== focusKey; });
    if (W / H > 16 / 9 * 0.9) {
      var mainW = Math.round(W * 0.76);
      place([focusKey], pad, pad, mainW, H, gap);
      place(rest, pad + mainW + gap, pad, W - mainW - gap, H, gap);
    } else {
      var mainH = Math.round(H * 0.68);
      place([focusKey], pad, pad, W, mainH, gap);
      place(rest, pad, pad + mainH + gap, W, H - mainH - gap, gap);
    }
  }

  // ---- Camera panel ----
  var listEl = document.getElementById("cam-list");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  function renderList(cams) {
    listEl.innerHTML = cams.map(function (c, i) {
      var note = c.custom ? "Added by you" : "";
      return '<li class="cam" data-key="' + esc(c.key) + '">' +
        '<label><input type="checkbox"' + (isShown(c.key) ? " checked" : "") + '>' +
          '<span class="cam-code">' + esc(c.code) + '</span>' +
          '<span class="cam-name">' + esc(c.title) + (note ? '<span class="cam-note">' + note + '</span>' : '') + '</span></label>' +
        (c.custom ? '<button class="cam-del" data-act="del" title="Remove" aria-label="Remove ' + esc(c.title) + '">&#x2715;</button>' : '') +
        '<span class="cam-move">' +
          '<button data-act="up" aria-label="Move ' + esc(c.code) + ' up"' + (i === 0 ? " disabled" : "") + '>&#x25B2;</button>' +
          '<button data-act="down" aria-label="Move ' + esc(c.code) + ' down"' + (i === cams.length - 1 ? " disabled" : "") + '>&#x25BC;</button>' +
        '</span></li>';
    }).join("");

    var n = cams.filter(function (c) { return isShown(c.key); }).length;
    var bw = document.getElementById("bw-note");
    bw.textContent = n > HEAVY_COUNT
      ? n + " streams at once is heavy — expect buffering on slower connections."
      : "Showing " + n + " of " + cams.length + ". Each stream uses its own bandwidth.";
    bw.classList.toggle("warn", n > HEAVY_COUNT);
  }

  function setShown(key, on) {
    state.hidden = state.hidden.filter(function (k) { return k !== key; });
    if (!on) state.hidden.push(key);
    save(); render();
  }

  listEl.addEventListener("change", function (e) {
    var li = e.target.closest(".cam");
    if (li) setShown(li.getAttribute("data-key"), e.target.checked);
  });

  listEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var key = b.closest(".cam").getAttribute("data-key"), act = b.getAttribute("data-act");
    if (act === "del") {
      state.custom = state.custom.filter(function (c) { return "yt:" + c.id !== key; });
    } else {
      var order = cameras().map(function (c) { return c.key; });
      var i = order.indexOf(key), j = act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= order.length) return;
      order[i] = order[j]; order[j] = key;
      state.order = order;
    }
    save(); render();
    var again = listEl.querySelector('[data-key="' + CSS.escape(key) + '"] [data-act="' + act + '"]');
    if (again && !again.disabled) again.focus();
  });

  function setAll(on) {
    state.hidden = on ? [] : cameras().map(function (c) { return c.key; });
    save(); render();
  }
  document.getElementById("all-btn").addEventListener("click", function () { setAll(true); });
  document.getElementById("none-btn").addEventListener("click", function () { setAll(false); });

  // Add any YouTube video or live stream by link (or bare 11-character ID)
  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("add-url"), msg = document.getElementById("add-msg");
    var v = input.value.trim();
    var m = /(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/.exec(v) || /^([\w-]{11})$/.exec(v);
    if (!m) { msg.textContent = "That doesn't look like a YouTube video link."; return; }
    var id = m[1];
    if (cameras().some(function (c) { return c.id === id; })) { msg.textContent = "That stream is already in the list."; return; }
    msg.textContent = "";
    var entry = { id: id, title: "YouTube " + id };
    state.custom.push(entry);
    input.value = "";
    save(); render();
    // Best effort: swap the placeholder name for the video's real title
    fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id))
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { entry.title = j.title; save(); render(); })
      .catch(function () {});
  });

  // ---- Panel toggle / header ----
  var panel = document.getElementById("panel"), panelBtn = document.getElementById("panel-btn");
  function showPanel(on) {
    state.panel = on;
    panel.hidden = !on;
    panelBtn.setAttribute("aria-pressed", on ? "true" : "false");
    document.getElementById("empty-btn").style.display = on ? "none" : "";
    save();
    layout();
  }
  panelBtn.addEventListener("click", function () { showPanel(!state.panel); });
  document.getElementById("empty-btn").addEventListener("click", function () { showPanel(true); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && focusKey) { focusKey = null; layout(); }
  });

  var clock = document.getElementById("clock");
  function tick() { clock.textContent = new Date().toLocaleTimeString([], { hour12: false }); }
  tick(); setInterval(tick, 1000);

  new ResizeObserver(function () { layout(); }).observe(stage);

  var released = new Date(APP_RELEASED + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  document.getElementById("version-note").textContent = "v" + APP_VERSION + " // Released " + released;

  showPanel(state.panel);
  setStatus("Checking");
  render();
  loadLive();
  setInterval(function () { if (!document.hidden) loadLive(); }, LIST_REFRESH);
})();
</script>
</body>
</html>
